name: Deploy to Vercel

on:
  push:
    branches:
      - main
  # 코드가 아니라 **데이터만** 바뀌었을 때 프론트를 다시 굽기 위한 수동 트리거.
  # /keyword 허브 같은 ISR 페이지는 빌드 시점의 API 응답을 그대로 굳히고
  # revalidate(6h) 까지 버틴다. 실제로 난이도 v2 백필 직후, 프론트가 백필
  # 몇 분 전에 빌드돼 있어서 새 템플릿에 옛 점수가 박힌 채로 서비스됐다.
  # 이걸 고치려고 의미 없는 빈 커밋을 만드는 대신 여기서 돌린다.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Deployment
        run: |
          curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
