name: SEO keyword pages — precompute

# 프로그래매틱 SEO 페이지를 조금씩 계속 만든다.
#
# 왜 조금씩인가: 키워드 1개 측정에 약 53초가 걸린다(SERP 난이도 + 경쟁도).
# 배치를 작게 잡고 자주 돈다.
#
# ⚠️ 선별(enrich)과 측정(precompute)은 반드시 분리해서 돌린다.
# 둘 다 keywordstool 을 때린다 — 측정의 competition 단계가 내부적으로
# search_keyword_with_tabs → get_related_keywords_from_searchad 를 호출한다.
# 연달아 돌리면 네이버 스로틀링에 걸려 키워드당 53초가 300초까지 늘어졌다.
#
# 필요 GitHub Secrets:
#   CRON_TOKEN — 백엔드 CRON_TOKEN 과 동일 값 (rank-tracker cron 과 공유)

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "이번 실행에서 측정할 키워드 수"
        required: false
        default: "15"
      expand:
        description: "연관 키워드로 큐를 확장할지 (true/false)"
        required: false
        default: "true"

concurrency:
  group: seo-pages-precompute
  cancel-in-progress: false

env:
  BACKEND_URL: https://blog-index-analyzer.fly.dev

jobs:
  precompute:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Enrich volumes
        continue-on-error: true
        env:
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
        run: |
          if [ -z "$CRON_TOKEN" ]; then
            echo "::error::CRON_TOKEN secret 미설정"
            exit 1
          fi
          body=$(curl -sS -X POST "${BACKEND_URL}/api/seo/enrich-volumes" \
            -H "Authorization: Bearer ${CRON_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"limit": 200}' \
            --max-time 300 \
            -o response.json -w '%{http_code}')
          echo "status=${body}"
          echo "body=$(cat response.json)"

      - name: Cooldown
        run: sleep 60

      - name: Trigger precompute
        env:
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
          LIMIT: ${{ github.event.inputs.limit || '15' }}
          EXPAND: ${{ github.event.inputs.expand || 'true' }}
        run: |
          if [ -z "$CRON_TOKEN" ]; then
            echo "::error::CRON_TOKEN secret 미설정"
            exit 1
          fi
          status=$(curl -sS -X POST "${BACKEND_URL}/api/seo/precompute" \
            -H "Authorization: Bearer ${CRON_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"limit\": ${LIMIT}, \"expand\": ${EXPAND}}" \
            --max-time 60 \
            -o response.json -w '%{http_code}')
          echo "status=${status}"
          echo "body=$(cat response.json)"
          if [ "$status" != "200" ]; then
            echo "::error::precompute 트리거 실패 status=$status"
            exit 1
          fi

      - name: Report stats
        run: |
          echo "::notice::stats=$(curl -sS --max-time 30 "${BACKEND_URL}/api/seo/stats")"
