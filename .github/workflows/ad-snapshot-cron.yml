name: Ad snapshot — daily collect

# 광고 계정의 상태·성과를 매일 떠서 저장한다.
#
# 왜 매일 도는가: 지금까지 광고 데이터는 화면을 그릴 때만 읽고 버려졌다.
# 그래서 "광고가 언제부터 멈췄나"·"누가 언제 입찰을 바꿨나" 에 답할 과거가
# 아예 없었다. 실제로 소재 반려로 광고가 멈춘 것을 8일 뒤에야 발견한 적이 있다.
#
# ⚠️ 오늘부터 쌓지 않으면 한 달 뒤에도 비교할 과거가 없다. 화면보다 수집이 먼저다.
#
# 왜 새벽 4시(KST)인가: 네이버 통계는 전날치가 새벽에 확정된다. 그리고 이 시간대는
# 다른 크론(키워드풀·SEO 페이지)과 겹치지 않아 레이트리밋을 나눠 쓰지 않는다.
#
# 필요 GitHub Secrets:
#   CRON_TOKEN — 백엔드 CRON_TOKEN 과 동일 값 (다른 cron 과 공유)

on:
  schedule:
    # 19:00 UTC = 04:00 KST
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      customer_id:
        description: "특정 광고주만 수집 (비우면 전체)"
        required: false
        default: ""
      days:
        description: "며칠 치를 다시 수집할지 (비우면 전환 지연 흡수 구간)"
        required: false
        default: ""
      ad_group_scan_limit:
        description: "소재 검수상태를 확인할 광고그룹 수 상한"
        required: false
        default: "400"

concurrency:
  group: ad-snapshot-collect
  cancel-in-progress: false

env:
  BACKEND_URL: https://blog-index-analyzer.fly.dev

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Collect account snapshots
        env:
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
          CUSTOMER_ID: ${{ github.event.inputs.customer_id }}
          DAYS: ${{ github.event.inputs.days }}
          SCAN_LIMIT: ${{ github.event.inputs.ad_group_scan_limit || '400' }}
        run: |
          if [ -z "$CRON_TOKEN" ]; then
            echo "::error::CRON_TOKEN secret 미설정"
            exit 1
          fi
          url="${BACKEND_URL}/api/ad-snapshot/collect?ad_group_scan_limit=${SCAN_LIMIT}"
          if [ -n "$CUSTOMER_ID" ]; then
            url="${url}&customer_id=${CUSTOMER_ID}"
          fi
          if [ -n "$DAYS" ]; then
            url="${url}&days=${DAYS}"
          fi
          echo "POST ${url}"
          status=$(curl -sS -X POST "$url" \
            -H "Authorization: Bearer ${CRON_TOKEN}" \
            --max-time 1500 \
            -o response.json -w '%{http_code}')
          echo "status=${status}"
          cat response.json
          if [ "$status" != "200" ]; then
            echo "::error::수집 트리거 실패 status=$status"
            exit 1
          fi

      - name: Collect bulk reports
        continue-on-error: true
        env:
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
          CUSTOMER_ID: ${{ github.event.inputs.customer_id }}
        run: |
          # 키워드 단위는 /stats 단건으로 불가능하다(10만 콜 vs 시간당 1만).
          # 대량 리포트가 같은 데이터를 호출 몇 번으로 준다.
          url="${BACKEND_URL}/api/ad-snapshot/collect-reports"
          if [ -n "$CUSTOMER_ID" ]; then
            url="${url}?customer_id=${CUSTOMER_ID}"
          fi
          status=$(curl -sS -X POST "$url" \
            -H "Authorization: Bearer ${CRON_TOKEN}" \
            --max-time 1500 \
            -o reports.json -w '%{http_code}')
          echo "status=${status}"
          if [ "$status" != "200" ]; then
            echo "::warning::리포트 수집 실패 status=$status"
            exit 0
          fi
          python3 - <<'PY'
          import json
          d = json.load(open("reports.json"))
          for r in d.get("results", []):
              name = r.get("name") or r.get("customer_id")
              if r.get("errors"):
                  print(f"::warning::{name} 리포트 일부 실패 — {r['errors']}")
              km = r.get("keyword_master") or {}
              if km:
                  print(f"::notice::{name} 키워드 {km.get('keywords'):,}개 "
                        f"(그룹입찰 상속 {km.get('inherited_pct')}% / "
                        f"정지 {km.get('paused_pct')}%)")
              ad = r.get("ad_detail") or {}
              if ad:
                  u = ad.get("unattributed") or {}
                  print(f"::notice::{name} {ad.get('date')} 노출 "
                        f"{ad['totals']['impressions']:,} 클릭 {ad['totals']['clicks']:,} "
                        f"비용 {ad['totals']['cost']:,}원")
                  if u.get("clicks_pct", 0) >= 20:
                      # 등록 키워드로 설명 안 되는 몫이 크면 키워드 통계만 보면 헛다리다.
                      print(f"::warning::{name} 등록 키워드로 귀속 안 되는 트래픽 — "
                            f"클릭 {u['clicks_pct']}% / 비용 {u['cost_pct']}% "
                            f"({u['cost']:,}원). 키워드확장 설정을 확인하세요.")
              ex = r.get("expkeyword") or {}
              if ex.get("dropped_beyond_top_n"):
                  print(f"::warning::{name} 검색어 {ex['distinct_search_terms']:,}종 중 "
                        f"상위 {ex['top_n']:,}만 저장 "
                        f"({ex['dropped_beyond_top_n']:,}종 미저장)")
          PY

      - name: Scan for incidents
        env:
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
          CUSTOMER_ID: ${{ github.event.inputs.customer_id }}
        run: |
          url="${BACKEND_URL}/api/ad-snapshot/watch"
          if [ -n "$CUSTOMER_ID" ]; then
            url="${url}?customer_id=${CUSTOMER_ID}"
          fi
          status=$(curl -sS -X POST "$url" \
            -H "Authorization: Bearer ${CRON_TOKEN}" \
            --max-time 300 \
            -o incidents.json -w '%{http_code}')
          echo "status=${status}"
          if [ "$status" != "200" ]; then
            echo "::warning::사고 감시 호출 실패 status=$status"
            echo '{"scans":[]}' > incidents.json
          fi
          python3 - <<'PYEOF'
          import json, os, urllib.request
          d = json.load(open("incidents.json"))

          blocks, critical = [], 0
          for s in d.get("scans", []):
              name = s.get("name") or s.get("customer_id")
              msg = s.get("message")
              if not msg:
                  # 정상이면 침묵한다. 매일 "이상 없음" 을 보내면 곧 안 읽는다.
                  continue
              critical += int(s.get("critical") or 0)
              print(f"::error::[{name}] 사고 감지")
              for line in msg.splitlines():
                  print(f"  {line}")
              blocks.append("[" + str(name) + "]\n" + msg)

          # ── 발송 ────────────────────────────────────────────────
          # 알림 채널이 아예 없었다. 그동안 사고는 Actions 로그에만 찍히고 아무에게도
          # 닿지 않았다 — 감시가 돌아도 보는 사람이 없으면 감시가 아니다.
          if blocks:
              body = "광고비 관제탑 — 사고 감지\n\n" + "\n\n".join(blocks)
              url = (os.environ.get("ALERT_WEBHOOK_URL") or "").strip()
              if url:
                  try:
                      req = urllib.request.Request(
                          url,
                          data=json.dumps({"text": body}).encode(),
                          headers={"Content-Type": "application/json"},
                      )
                      urllib.request.urlopen(req, timeout=20)
                      print("::notice::알림 발송 완료")
                  except Exception as e:
                      # 발송 실패를 조용히 넘기면 "알림이 갔겠지" 라고 믿게 된다.
                      print(f"::warning::알림 발송 실패 — {e}")
              else:
                  print("::notice::ALERT_WEBHOOK_URL 미설정 — 웹훅 발송은 건너뜁니다"
                        " (긴급 건은 아래 잡 실패로 GitHub 이 메일을 보냅니다)")

          # 긴급이 있으면 잡을 실패시킨다. 자격증명 없이도 사람에게 닿는 유일한 경로다.
          # 주의는 실패시키지 않는다 — 매일 빨간불이 뜨면 곧 아무도 안 본다.
          if critical:
              raise SystemExit(f"긴급 사고 {critical}건 — 위 로그 참조")
          PYEOF

      - name: Summarize
        run: |
          # 계정별 결과를 요약한다. 일부 계정이 실패해도 나머지는 저장됐다.
          python3 - <<'PY'
          import json
          d = json.load(open("response.json"))
          print(f"accounts={d.get('accounts')} ok={d.get('succeeded')} failed={d.get('failed')}")
          for r in d.get("results", []):
              name = r.get("name") or r.get("customer_id")
              if not r.get("ok"):
                  print(f"::warning::{name} 수집 실패 — {r.get('errors')}")
                  continue
              missed = r.get("ad_groups_not_scanned") or 0
              total_g = r.get("ad_groups") or 0
              line = (f"{name}: 캠페인 {r.get('campaigns')} / 그룹 {total_g} "
                      f"/ 소재 {r.get('ads')} / 성과 {r.get('stat_rows')}행 "
                      f"/ 변경 {r.get('changes')}건")
              print(f"::notice::{line}")
              if r.get("ad_groups_flat_truncated"):
                  # 평면 조회가 1,000에서 잘려 캠페인별로 다시 훑은 계정.
                  # 콜 수가 늘어난 사실도 함께 알린다 — 레이트리밋과 직결된다.
                  print(f"::notice::{name} 그룹 조회가 평면 상한(1,000)에 걸려 "
                        f"캠페인별로 다시 훑었습니다 — 총 {total_g:,}개 "
                        f"({r.get('ad_groups_fetch_calls')}콜)")
              if missed:
                  # 조용히 자르지 않는다 — 못 본 그룹이 있으면 반드시 말한다.
                  # ★이 수치는 '전체 그룹 수' 기준이어야 한다. 예전에는 평면 조회가
                  #  1,001 에서 잘린 줄 모르고 1001-400=601 을 보고했다.
                  #  해울은 실제로 3,383 개를 못 보고 있었는데 601 이라고 말한 셈이다.
                  pct = round(missed / total_g * 100) if total_g else 0
                  print(f"::warning::{name} 소재 미확인 광고그룹 {missed:,}개 "
                        f"(전체 {total_g:,}개 중 {pct}% — 회전 스캔이라 며칠에 걸쳐 커버되지만, "
                        f"오늘 기준으로는 못 본 몫입니다)")
          PY
